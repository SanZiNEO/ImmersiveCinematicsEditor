appId: com.immersivecinematics.editor
productName: ImmersiveCinematicsEditor
artifactName: ${productName}-Setup-${version}-${arch}.${ext}
directories:
  output: release
# 更新源：只用于生成 app-update.yml；本地构建固定带 --publish never，不上传任何 Release。
publish:
  provider: github
  owner: SanZiNEO
  repo: ImmersiveCinematicsEditor
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
compression: maximum
# Electron 运行时走本地依赖解析（node_modules/electron/dist），不写死构建机绝对路径；
# 如需本机覆盖，可用命令行 `--config.electronDist=<路径>` 传入，覆盖配置不入包。
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ImmersiveCinematics Editor
